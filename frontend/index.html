<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }
    header {
      background: #4f46e5;
      color: #ffffff;
      padding: 16px 20px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user { align-self: flex-end; background: #4f46e5; color: #ffffff; }
    .model { align-self: flex-start; background: #e9eaf0; color: #1f2937; }
    .error { align-self: center; background: #fee2e2; color: #991b1b; }
    .bar {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
    }
    #input {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #send {
      padding: 12px 20px;
      font-size: 15px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #send:disabled { background: #a5a3d8; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>AI Study Assistant</h1>
      <p>Ask any study question. Your chats are saved in a SQL database.</p>
    </header>
    <div id="chat"></div>
    <div class="bar">
      <input id="input" type="text" placeholder="Type your question here..." autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function loadHistory() {
      try {
        const res = await fetch("/api/history");
        const list = await res.json();
        if (list.length === 0) {
          addMessage("Hi! I am your study assistant. Ask me anything.", "model");
        }
        list.forEach(function (m) {
          addMessage(m.content, m.role === "user" ? "user" : "model");
        });
      } catch (e) {
        addMessage("Could not load chat history. Is the server running?", "error");
      }
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (text === "") return;
      input.value = "";
      sendBtn.disabled = true;
      addMessage(text, "user");
      const thinking = addMessage("Thinking...", "model");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        thinking.remove();
        if (data.reply) {
          addMessage(data.reply, "model");
        } else {
          addMessage(data.error || "Unknown error", "error");
        }
      } catch (e) {
        thinking.remove();
        addMessage("Could not reach the server. Is it running?", "error");
      }
      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    loadHistory();
  </script>
</body>
</html>
